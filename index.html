<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The app never talks to any server: no data leaves the phone. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0176D3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TeraFinn">
<title>TeraFinn</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="phone.css">
<script src="vendor/jsQR.js" defer></script>
<script src="dashboard.js" defer></script>
<script src="phone.js" defer></script>
</head>
<body class="phone">
<header class="topbar"><span class="wordmark">TeraFinn</span><span id="fresh" class="fresh"></span></header>
<main id="page" tabindex="-1"></main>
<nav id="tabs" class="tabs" aria-label="Sections" hidden>
  <a href="#dashboard" data-page="dashboard">Dashboard</a>
  <a href="#transactions" data-page="transactions">Transactions</a>
  <a href="#accounts" data-page="accounts">Accounts</a>
  <a href="#settings" data-page="settings">Settings</a>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" hidden>
<noscript>TeraFinn needs JavaScript enabled.</noscript>
</body>
</html>
